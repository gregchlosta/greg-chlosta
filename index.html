        <h1 style="color:#fb923c;margin-top:0">Greg Chlosta</h1>
        <p>I love creating and building things: code, AI, and anything that moves. Motorcycles, cars, mountain bikes... I like to fix them and I'm always curious how things work.</p>
        <h2>Playing with AI</h2>
        <p>AI is the most fun I've had with computers in a long time. I'm always tinkering with new models and agents, building little tools and experiments just to see what's possible.</p>
        <h2>I write code</h2>
        <p>I've been writing code for years and I still love it. There's something really satisfying about starting with an idea and building it into something real that people can use, piece by piece.</p>
        <h2>If it's broken, I'll fix it</h2>
        <p>I do my own car work whenever I can, from regular maintenance to the occasional "how hard can it be?" project. A good set of tools and a free Saturday is pretty much my idea of a great time.</p>
        <h2>Motorcycles &amp; cars</h2>
        <p>Two wheels or four, I love anything that moves. Nothing clears my head like a ride on an open Alberta road, and I'm just as into how these machines work as how they feel to drive.</p>
        <h2>Mountain biking</h2>
        <p>Living this close to the Rockies means amazing trails are never far away. I climb for the view, come down for the grin, and of course I wrench on my own bikes too.</p>
        <h2>Calgary, Alberta</h2>
        <p>Calgary is home, with big prairie sky on one side and the mountains on the other. Always happy to grab a coffee and chat about tech, bikes or whatever you're building.</p>
        <h2>Projects around the house</h2>
        <p>Renovations, repairs, upgrades... if something around the house needs doing, I don't call a guy. I am the guy.</p>
        <h2>Say hi</h2>
        <p>Got an idea, a project, or just want to chat about AI, code or bikes? Drop me a line, I'd love to hear from you.</p>
